name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          unzip -q Zuno-Android-Project.zip -d android-project

      - name: Find Gradle project
        id: gradle
        run: |
          GRADLEW=$(find android-project -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found"
            find android-project -maxdepth 4 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found project: $PROJECT_DIR"

      - name: Build APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-APK
          path: ${{ steps.gradle.outputs.project_dir }}/app/build/outputs/apk/debug/*.apk
