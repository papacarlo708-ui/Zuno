name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Получаем файлы репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Устанавливаем Gradle 8.7
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 4. Распаковываем Android-проект
      - name: Unpack Android project
        id: project
        shell: bash
        run: |
          set -e

          echo "Поиск ZIP-файла..."

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP-файл не найден"
            exit 1
          fi

          echo "Найден ZIP: $ZIP_FILE"

          rm -rf project
          mkdir -p project

          unzip -o "$ZIP_FILE" -d project

          echo "Содержимое проекта:"
          find project -maxdepth 4 -type f | sort

          # Ищем settings.gradle.kts
          SETTINGS_FILE=$(find project \
            -type f \
            -name "settings.gradle.kts" \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts не найден"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Android project: $PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # 5. Проверяем Java и Gradle
      - name: Check Java and Gradle
        shell: bash
        run: |
          java -version
          gradle --version

      # 6. Исправляем JVM target
      - name: Configure JVM 17
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          cat >> gradle.properties <<'EOF'

          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          EOF

          echo "gradle.properties:"
          cat gradle.properties

      # 7. Проверяем структуру проекта
      - name: Check project
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          echo "Project files:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "settings.gradle.kts:"
          cat settings.gradle.kts

          echo ""
          echo "Root build.gradle.kts:"
          cat build.gradle.kts

      # 8. Собираем APK
      - name: Build APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon

      # 9. Ищем APK
      - name: Find APK
        id: apk
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK не найден"
            exit 1
          fi

          echo "APK найден:"
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      # 10. Загружаем APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zuno-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
